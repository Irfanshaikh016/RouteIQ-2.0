# RouteIQ 2.0 - Render Infrastructure Specification (Phase 3)
# Blueprint configuration for zero-downtime Python backend deployment
services:
  - type: web
    name: routeiq-backend
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: RouteIQ 2.0 Backend
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://routeiq.vercel.app
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
